# Provenance ledger for Chapter 0, The physicist's way of seeing. One entry per numbered section, plus the case
# figure and the two stories this chapter introduces. Course and book names are the keys in provenance/sources.yml.
"0.1":
  ocw:
    - {course: "8.01SC Classical Mechanics, Fall 2016", where: "Course notes Ch 1 §1.1 (models built from observation and generalised; limits of Newtonian mechanics)", url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_chapter1.pdf", took: "idea: observation first, then a model with limits"}
  openstax:
    - {book: "Physics", section: "1.2 The Scientific Methods", url: "https://openstax.org/books/physics/pages/1-2-the-scientific-methods", took: "definitions of observation, model, law; models hold only within limits"}
    - {book: "College Physics 2e", section: "1.1 Physics: An Introduction", url: "https://openstax.org/books/college-physics-2e/pages/1-1-physics-an-introduction", took: "law vs theory; 'just a theory' warning; laws are never proved absolutely"}
    - {book: "Astronomy 2e", section: "2.2 Ancient Astronomy", url: "https://openstax.org/books/astronomy-2e/pages/2-2-ancient-astronomy", took: "Aristotle's round-Earth evidence (eclipse shadow, stars, ships hull-first); Pythagoras' belief without evidence; the missing stellar parallax; Eratosthenes told about the Syene well; Greeks knew the Earth was round long before Columbus"}
  research:
    - {what: "a demonstration changes a belief only after a prediction (elicit, confront, resolve); the predict-first box", source: "Halloun & Hestenes 1985, via research/misconceptions.md", url: "https://davidhestenes.net/modeling/R&E/Hestenes_CommonSenseConcept.pdf"}
    - {what: "IGCSE 0625 has no observation/model topic; MYP names Models and Evidence as related concepts", source: "research/school-wording.md §1 and §3", url: "https://www.cambridgeinternational.org/Images/697209-2026-2028-syllabus.pdf"}
  figures:
    - {name: c0_hull_down, origin: ours}
  licence: "CC BY-NC-SA 4.0"
