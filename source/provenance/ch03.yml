# Chapter 3 ledger: Forces come in pairs. One entry per numbered section; the mosquito case file's sources sit under 3.5.
# Course and book names are the exact keys in provenance/sources.yml. Every number in `computed:` was run with
# python3 -I -c on 2026-10-28; ASSUMED marks an input we chose because no source gives one.
"3.1":
  ocw:
    - {course: "8.01SC Classical Mechanics, Fall 2016", where: "Course notes Ch 7 §7.1 (forces add as vectors is an experimental result; Example 7.1 too advanced, replaced by a 1D cart)", url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_chapter7.pdf", took: "idea"}
    - {course: "8.01SC Classical Mechanics, Fall 2016", where: "Week 2 Lesson 7.1 Pushing, Pulling and Tension (tug of war; tension the same along a light rope)", url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-2-newtons-laws/7-1-pushing-pulling-and-tension/", took: "idea"}
