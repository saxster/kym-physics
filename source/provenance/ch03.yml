    - {book: "Physics", section: "4.1 Force", url: "https://openstax.org/books/physics/pages/4-1-force", took: "net, external and internal force; free-body diagram as a dot with external forces only; one positive direction (its opening 'force is the cause of motion' line rejected)"}
