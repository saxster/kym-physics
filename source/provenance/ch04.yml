# Provenance ledger for Chapter 4, Falling. Course and book names are the keys in provenance/sources.yml.
# "computed:" lists the python3 -I sums behind every number the chapter states (kept for the fact gate).
"4.1":
  ocw:
    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Course notes Ch 5 §5.2 (a_y = −g independent of mass; Galileo's law of free fall rests on the force law)"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_chapter5.pdf"
      took: "idea: weight is proportional to mass, so mass cancels and the acceleration is the same for everything"
    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Week 2, Lesson 5.3 Gravity at the surface of the Earth: the value of g"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-2-newtons-laws/5-3-gravity-at-the-surface-of-the-earth-the-value-of-g/"
      took: "sequence"
  openstax:
    - book: "College Physics 2e"
      section: "2.7 Falling Objects (free fall; g = 9.80 and its 9.78–9.83 range; y = ½gt², v = gt; the precise-g example 1.0000 m in 0.45173 s; the reaction-time ruler)"
      url: "https://openstax.org/books/college-physics-2e/pages/2-7-falling-objects"
      took: "sequence, definitions, numbers, worked example, activity"
    - book: "College Physics 2e"
      section: "6.5 Newton's Universal Law of Gravitation (g = GM/r²; weight proportional to mass; take-home drop of marble, ball, spoon and paper)"
      url: "https://openstax.org/books/college-physics-2e/pages/6-5-newtons-universal-law-of-gravitation"
      took: "idea, demo"
  research:
    - source: "Halloun & Hestenes 1985, via source/research/misconceptions.md §4"
      url: "https://davidhestenes.net/modeling/R&E/Hestenes_CommonSenseConcept.pdf"
      what: "82% of 478 students believed an object's intrinsic properties affect its free fall in a vacuum"
    - source: "Hast & Howe, via source/research/misconceptions.md §4"
      url: "https://research.stmarys.ac.uk/id/eprint/223/8/Hast-Howe-Understanding-the-Beliefs-Informing-Childrens-Commonsense-Theories.pdf"
      what: "heavier-is-faster belief appears from age 5"
    - source: "source/research/misconceptions.md §4"
      url: "source/research/misconceptions.md"
      what: "₹1 and ₹5 coins dropped onto a steel thali: one clink"
  history:
    - what: "Stevin and de Groot at the Nieuwe Kerk, Delft, 1586: two lead balls, one ten times heavier, about 30 ft, one thud; published 1586, three years before Galileo reached Pisa (TRUE)"
      source: "source/research/history.md §1"
      url: "https://en.wikipedia.org/wiki/Delft_tower_experiment"
    - what: "Pisa drop rests on Viviani alone; most historians think it a thought experiment (LEGEND, told as a legend)"
      source: "source/research/history.md §1"
      url: "https://physicsworld.com/a/the-legend-of-the-leaning-tower/"
    - what: "Philoponus, Alexandria, 6th c.: the difference in fall time between very different weights is tiny (TRUE)"
      source: "source/research/history.md §1"
      url: "https://www.vaticanobservatory.org/wp-content/uploads/2017/10/Impetus-Philoponus.pdf"
    - what: "Aristotle: heavier falls faster in proportion to weight"
      source: "source/research/history.md §1 (Philoponus entry)"
      url: "https://www.encyclopedia.com/topic/John_Philoponus.aspx"
  figures:
    - {name: c4_two_predictions, origin: ours}
  computed:
    - "30 ft = 30*0.3048 = 9.14 m; fall time sqrt(2*9.144/9.8) = 1.37 s; on Aristotle's rule the light ball is 1/10 of the way down (0.91 m) when the heavy one lands, i.e. about 8 m up"
    - "v = gt and y = ½gt²: 1 s → 9.8 m/s, 4.9 m; 2 s → 19.6 m/s, 19.6 m; 3 s → 29.4 m/s, 44.1 m"
    - "precise g: 2*1.0000/0.4517**2 = 9.80 m/s²"
    - "reaction ruler sqrt(2d/9.8): 0.10 m → 0.143 s; 0.20 m → 0.202 s; 0.30 m → 0.247 s"
    - "check: 4 m balcony sqrt(2*4/9.8) = 0.904 s"
  licence: "CC BY-NC-SA 4.0 (MIT OCW; OpenStax)"

