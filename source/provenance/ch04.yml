  openstax:
    - book: "College Physics 2e"
      section: "5.2 Drag Forces (hand through water flat vs edge-on; drag ∝ v²; terminal velocity; skydiver head-down ≈ 350 km/h and spread-eagle ≈ 200 km/h; Haldane's small-animal point paraphrased; heavier skydiver question)"
      url: "https://openstax.org/books/college-physics-2e/pages/5-2-drag-forces"
      took: "sequence, definitions, worked examples, concept question"
