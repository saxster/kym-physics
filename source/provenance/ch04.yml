      url: "https://nssdc.gsfc.nasa.gov/planetary/lunar/apollo_15_feather_drop.html"
    - what: "Hadley Rille, 2 August 1971; 'Mr Galileo was correct in his findings' quoted as the transcription's wording, hedged (TRUE; audio to be checked at the gate)"
