      section: "7.2 lab: four sheets of paper (flat vs crumpled; one crumpled vs two crumpled together) and its check question"
      url: "https://openstax.org/books/physics/pages/7-2-newtons-law-of-universal-gravitation-and-einsteins-theory-of-general-relativity"
      took: "demo, concept question"
  research:
    - source: "NASA GPM FAQ: How fast do raindrops fall?"
      url: "https://gpm.nasa.gov/resources/faq/how-fast-do-raindrops-fall"
      what: "speed rises with drop size to a maximum of about 10 m/s; from 4000 m such a drop takes at least 400 s"
    - source: "NASA GPM: Anatomy of a raindrop"
      url: "https://gpm.nasa.gov/education/videos/anatomy-raindrop"
      what: "drops are not tear-shaped; small drops round, 2–3 mm flattened like a bun, above 4.5 mm parachute shape and break-up"
    - source: "source/research/school-wording.md §1"
      url: "https://www.cambridgeinternational.org/Images/697209-2026-2028-syllabus.pdf"
      what: "IGCSE: air resistance; constant speed unless a resultant force acts"
  figures:
    - {name: c4_drag_balance, origin: ours}
  computed:
    - "no-drag arrival from 4000 m: sqrt(2*9.8*4000) = 280 m/s = 1008 km/h"
    - "6.5 m/s = 23.4 km/h; 10 m/s = 36 km/h; 4000/10 = 400 s = 6.7 min"
    - "Table 8.3 raindrop recomputed: sqrt(2*4e-6*9.8/(0.5*3e-6*1.225)) = 6.53 m/s; diameter from 4 mg of water: 1.97 mm"
    - "head-down skydiver (OS College inputs 75 kg, 0.18 m², C 0.70, ρ 1.21): 98.2 m/s = 353 km/h"
    - "figure curve: v(t) = 6.5 tanh(9.8 t / 6.5)"
  licence: "CC BY-NC-SA 4.0 (MIT OCW; OpenStax); NASA text cited, not copied"

