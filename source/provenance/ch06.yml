# Ledger for Chapter 6: Pressure, floating and the ocean of air.
# course:/book: names are the exact keys in provenance/sources.yml. `computed:` lists the python3 -I arithmetic
# behind every number in the text and figures (inputs marked ASSUMED are model numbers the chapter labels as such).
"6.1":
  ocw:
    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Course notes Ch 27 Static Fluids §27.1–27.3 (fluid vs solid; pressure; the pascal; pressure from molecular collisions)"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_chapter27.pdf"
      took: "definitions; molecular-collision picture of pressure"
  openstax:
    - book: "College Physics 2e"
      section: "11.1 What Is a Fluid?; 11.3 Pressure (Fig 11.5 finger vs needle; tyre and swimmer pictures; pressure is a scalar)"
      url: "https://openstax.org/books/college-physics-2e/pages/11-3-pressure"
      took: "sequence, definitions, fluid pushes on every surface"
    - book: "College Physics 2e"
      section: "Ch 11 Conceptual Questions (knife sharpness)"
      url: "https://openstax.org/books/college-physics-2e/pages/11-conceptual-questions"
      took: "concept question (the knife)"
  research:
    - what: "elephant vs stiletto hook (all inputs ASSUMED, labelled made-up in the text)"
      source: "BOOKPLAN §5 Ch 6; grounding/ch06.md 6.1"
      url: ""
  computed:
    - "elephant 4000 kg on 4 × 0.1 m² (ASSUMED): 4000×9.8 = 39,200 N; /0.4 = 98 kPa; heel 60 kg on 1 cm² (ASSUMED): 588 N /1e-4 = 5.9 MPa; ratio ≈ 60"
    - "atta packet 20×12×5 cm (ASSUMED), 1 kg: 9.8 N; 240 cm² → 408 Pa; 60 cm² → 1,633 Pa; ratio 4.0"
  figures:
    - {name: c6_pressure, origin: ours}
  licence: "CC BY-NC-SA 4.0"
