  research:
    - {what: "phases = Earth's shadow, 41–44% (Sadler 1992, Baxter 1988)", source: "research/misconceptions.md §12", url: ""}
    - {what: "synodic 29.53 d, sidereal 27.3217 d, semimajor axis 384,400 km", source: "NASA NSSDC Moon Fact Sheet", url: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html"}
    - {what: "IGCSE 0625 6.1.1.3 'approximately one month… cycle of phases'; 'dark side' not used", source: "research/school-wording.md", url: ""}
  computed:
    - "360/29.5306 = 12.19 deg/day against the Sun; 360/27.3217 = 13.18 against the stars"
    - "24*60*12.19/360 = 49 min later moonrise per day (printed as 'about 50 minutes'; ignores orbital tilt and latitude)"
    - "384400/(2*6371) = 30.2 Earth-diameters"
  figures:
    - {name: c14_phases, origin: "redrawn from the idea of OpenStax Astronomy 2e Fig 4.14, with its scale problem stated in the caption"}
  unsourced:
    - "amavasya = new Moon and purnima = full Moon (Indian calendar names): common usage, no source in the grounding; flagged"
  licence: "CC BY-NC-SA 4.0"
"14.4":
  ocw:
    - {course: "8.282J Introduction to Astronomy, Spring 2006", where: "Problem Set 1, Problem 1 (Aristarchus: the Moon's size and distance from a lunar eclipse)", url: "https://ocw.mit.edu/courses/8-282j-introduction-to-astronomy-spring-2006/resources/ps1/", took: "½° angular sizes of Sun and Moon"}
  openstax:
    - {book: "Astronomy 2e", section: "4.7 Eclipses of the Sun and Moon", url: "https://openstax.org/books/astronomy-2e/pages/4-7-eclipses-of-the-sun-and-moon", took: "400 times wider and 400 times farther; umbra and penumbra; solar at new Moon, lunar at full; 5° tilt and eclipse seasons twice a year; Earth's shadow about 1.4 million km; annular eclipses; lunar eclipses last longer; coppery red from refraction; predicted centuries ahead; eye-safety warnings and the 1 mm pinhole projector; filters and smoked glass unsafe"}
  research:
    - {what: "Moon radius 1737.4 km, inclination 5.145°, perigee 363,300 and apogee 405,500 km; Sun radius 695,700 km; AU 149.598 million km", source: "NASA NSSDC Moon, Sun and Earth Fact Sheets", url: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html"}
    - {what: "'apparent, not actual, size' bridge (NCERT Curiosity Class 7)", source: "research/misconceptions.md §12", url: ""}
    - {what: "eclipses: 0 mentions in IGCSE 0625; Lower Secondary 7ESs covers eclipses and tides", source: "research/school-wording.md", url: ""}
  history:
    - {what: "Aryabhata: eclipses are shadows, not demons", source: "research/history.md §2", url: "https://en.wikipedia.org/wiki/Aryabhatiya"}
  computed:
    - "695700/1737.4 = 400.4; 149.598e6/384400 = 389.2; diameters 1,391,400 km and 3,474.8 km"
    - "angular sizes 2*atan(1737.4/384400) = 0.518 deg and 2*atan(695700/149.598e6) = 0.533 deg"
    - "shadow length 149.598e6*6371/(695700-6371) = 1.38 million km (similar triangles)"
    - "384400*sin(5.145 deg) = 34,472 km off the plane at most, against Earth's radius 6,371 km"
  figures:
    - {name: c14_eclipse_tilt, origin: "redrawn from the idea of OpenStax Astronomy 2e Figs 4.21–4.24, our geometry; the tilt is drawn steeper than 5° and the caption says so"}
  licence: "CC BY-NC-SA 4.0"
"14.5":
  openstax:
    - {book: "Astronomy 2e", section: "4.6 Ocean Tides and the Moon", url: "https://openstax.org/books/astronomy-2e/pages/4-6-ocean-tides-and-the-moon", took: "daily delay of high tide equals the delay in moonrise; the Moon pulls each part of Earth differently and tides come from the differences; the bulges are an actual flow of water, not lifting; two bulges, two highs a day; the Sun less than half as effective; spring and neap tides and the name 'spring up'; land, friction, rotation, wind and depth make tide tables necessary; nearly 1 m on an all-water Earth, about 20 cm in the solid Earth; 0.002 s per century and 3.8 cm per year from Apollo mirrors"}
  research:
    - {what: "Sun and Moon masses and distances for the tidal ratio; Earth radius", source: "NASA NSSDC Sun, Moon and Earth Fact Sheets", url: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html"}
    - {what: "two-thirds name the Moon's attraction but cannot picture it globally (Corrochano 2017); Haji Ali causeway open at low tide, submerged at high tide", source: "research/misconceptions.md §12", url: ""}
  history:
    - {what: "Haji Ali causeway submerged at high tide; Mumbai tide 'mixed semi-diurnal, two highs of unequal height' (HEDGE); one day's forecast 3.93 m high and 1.43 m low (newspaper report, labelled as one day's forecast in the text); typical range UNSOURCED (INCOIS unreachable)", source: "research/history.md §9", url: "https://www.freepressjournal.in/mumbai/mumbai-on-alert-as-393-metre-high-tide-expected-today-imd-warns-of-heavy-rain-strong-winds"}
  computed:
    - "tidal ratio (M_sun/d_sun^3)/(M_moon/d_moon^3) = 0.459 (about 46%)"
    - "near/far pull ratio ((384400+6371)/(384400-6371))^2 = 1.0685: the Moon pulls the near sea about 7% harder than the far sea"
    - "lunar day 24*29.5306/28.5306 = 24.841 h; half = 12.42 h (about 12 h 25 min); delay (24.841-24)*60 = 50 min"
    - "spring to spring 29.5306/2 = 14.77 days"
    - "one day's forecast range 3.93-1.43 = 2.5 m (HEDGE; one day only)"
    - "case: 7 days x 50 min = 5 h 50 min, so a 10:30 low moves to about 16:20; the other low about 12 h 25 min earlier, about 03:55"
  figures:
