    - {course: "8.282J Introduction to Astronomy, Spring 2006", where: "Problem Set 1, Problem 2 (Aristarchus: the Sun's distance from the quarter Moon)", url: "https://ocw.mit.edu/courses/8-282j-introduction-to-astronomy-spring-2006/resources/ps1/", took: "background only (quarter-Moon geometry)"}
  openstax:
