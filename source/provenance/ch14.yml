# Chapter 14, Earth, Moon and Sun. One entry per numbered section, figure and story first linked here.
# No MIT OCW course in the spine covers seasons or tides (grounding/ch14.md): this chapter rests on OpenStax
# Astronomy 2e 4.1–4.7, MIT 8.282J Problem Set 1 (Aristarchus' methods) and NASA fact sheets. Every number in the
# chapter was recomputed with python3 -I -c (see "computed:" notes).
"14.1":
  ocw:
    - {course: "8.282J Introduction to Astronomy, Spring 2006", where: "Calendar, Lecture 2 'Greek Astronomy' (no notes posted)", url: "https://ocw.mit.edu/courses/8-282j-introduction-to-astronomy-spring-2006/pages/syllabus/", took: "sequence position only"}
  openstax:
    - {book: "Astronomy 2e", section: "4.1 Earth and Sky", url: "https://openstax.org/books/astronomy-2e/pages/4-1-earth-and-sky", took: "watching the sky cannot decide whether Earth or sky turns; astronomers accepted the turning Earth from the 1600s; Foucault 1851 as the demonstration; a pendulum keeps its plane; latitude"}
  research:
    - {what: "Earth volumetric mean radius 6371 km; obliquity 23.44°", source: "NASA NSSDC Earth Fact Sheet", url: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html"}
    - {what: "IGCSE 0625 6.1.1 wording: rotates 'once in approximately 24 hours'", source: "research/school-wording.md", url: ""}
  history:
    - {what: "Aryabhata, Kusumapura, 499 CE: the boat picture; born 476 (age about 23 computed)", source: "research/history.md §2 and cast table", url: "https://en.wikipedia.org/wiki/Aryabhatiya"}
    - {what: "Foucault, Panthéon 1851: 67 m wire, 28 kg bob (Astronomy 2e says 60 m and about 25 kg; the primary-research figure is used); 'Avez-vous vu tourner la Terre?'", source: "research/history.md true-stories list (Comptes Rendus Physique 2017)", url: "https://comptes-rendus.academie-sciences.fr/physique/item/10.1016/j.crhy.2017.11.003.pdf"}
  computed:
    - "360/24 = 15.0 deg/h"
    - "2*pi*6371*cos(19.08 deg)/24 = 1576 km/h (ASSUMED spherical Earth, 24 h day)"
    - "Foucault turning rate 15*sin(latitude) deg/h: Paris 48.85 N -> 11.3; Mumbai 19.08 N -> 4.9 deg/h, full turn 24/sin(lat) = 73.4 h (about three days). The sin(latitude) rule is standard physics not in the grounding note: flagged for the fact gate"
  figures:
    - {name: c14_boat, origin: ours}
  licence: "CC BY-NC-SA 4.0"
"14.2":
  openstax:
    - {book: "Astronomy 2e", section: "4.2 The Seasons", url: "https://openstax.org/books/astronomy-2e/pages/4-2-the-seasons", took: "distance argument refuted (closest in January; hemispheres opposite); axis points the same way all year; two effects, angle and day length; flashlight demo; noon altitude = 90 − |latitude − declination|; solstices over the tropics, equinoxes over the equator with about 12 h; refraction adds minutes; warmest weeks come after the solstice; near the equator seasons are wet and dry"}
  research:
    - {what: "obliquity 23.44°; perihelion 147.095 and aphelion 152.100 million km", source: "NASA NSSDC Earth Fact Sheet", url: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html"}
    - {what: "seasons-distance misconception: A Private Universe (count hedged as 'most of those asked', secondary write-ups); IOP 'by far the most common explanation'; January is Mumbai's coolest month; Australia has summer in December", source: "research/misconceptions.md §12", url: ""}
    - {what: "IGCSE 0625 6.1.1: orbit 'approximately 365 days… periodic nature of the seasons'; tilt not linked; bridge sentence", source: "research/school-wording.md", url: ""}
  history:
    - {what: "IMD normal monsoon onset for Mumbai, 11 June", source: "research/history.md §9", url: "https://mausam.imd.gov.in/backend/assets/press_release_pdf/IMD_Press_release_new_onset_and_withdrawal_dates%28Final%29.pdf"}
    - {what: "May 34.3 °C and July 29.4 °C afternoons: cross-reference to this book's Chapter 8 case (its own ledger)", source: "src/ch08.md", url: ""}
  computed:
    - "152.100/147.095 = 1.034 (3.4% farther); squared = 1.0692 (about 7% more sunlight in early January); difference 5.005 million km"
    - "noon Sun at 19.08 N: 90-|19.08-23.44| = 85.64 (June, 4.36 deg north of overhead); 90-19.08 = 70.92 (equinox); 90-(19.08+23.44) = 47.48 (December)"
    - "sin(85.64)/sin(47.48) = 1.353: the same beam lights 35% more ground in December, so about a third less light per square metre"
    - "day length cos H = -tan(lat) tan(dec): 13.15 h (June) and 10.85 h (December), geometric; about 2.3 h difference"
    - "torch tilted 60 deg from straight down: 1/cos(60) = 2.0 times the area"
    - "zero-shadow days near 2026-05-16 and 2026-07-27 from the approximate declination formula (grounding); printed only as 'around mid-May and late July'; needs an almanac check"
  figures:
    - {name: c14_tilt_orbit, origin: "redrawn from the idea of OpenStax Astronomy 2e Fig 4.5, our geometry and NASA numbers"}
    - {name: c14_sun_height, origin: "redrawn from the idea of OpenStax Astronomy 2e Fig 4.6, with Mumbai's computed Sun heights"}
  licence: "CC BY-NC-SA 4.0"
"14.3":
