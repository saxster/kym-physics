# Ledger for the stories in the motion and fluids groups (impetus, inertia, third-law, momentum, falling, circular,
# ocean-of-air, floating) and their s_ figures. Course and book names are the keys in provenance/sources.yml.
# Numbers quoted in the stories were recomputed with python3 -I (commands in the grounding notes and in the writer's
# report); inputs marked "guesses" in the text are ASSUMED.

"story:impetus":
