    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Week 2 Lesson 4.1 (forces always involve a real physical interaction; F = dp/dt)"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/pages/week-2-newtons-laws/4-1-newtons-first-and-second-laws/"
      took: "two-object test for a force"
    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Course notes Ch 7 §7.2-7.3 (Newton's Law 1 commentary on projectiles; quantity of motion); §7.2 Galileo first grasped inertia"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_chapter7.pdf"
      took: "paraphrase of Newton on projectiles and planets; definition of quantity of motion"
  openstax:
    - book: "College Physics 2e"
      section: "4.2 Newton's First Law of Motion: Inertia (experience says moving things stop; friction the unseen force)"
      url: "https://openstax.org/books/college-physics-2e/pages/4-2-newtons-first-law-of-motion-inertia"
      took: "framing"
