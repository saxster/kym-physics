"story:p-stevin":
  ocw:
    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Course notes Ch 5 §5.2 Free Fall (mass independence when air drag is negligible)"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_chapter5.pdf"
      took: "equal free-fall acceleration independent of mass"
  openstax:
    - book: "College Physics 2e"
      section: "2.7 Falling Objects; 5.2 Drag Forces"
      url: "https://openstax.org/books/college-physics-2e/pages/2-7-falling-objects"
      took: "why dense balls minimise air resistance relative to weight; Pisa drop framed as legend"
  history:
    - what: "Delft, 1586: Simon Stevin and Jan Cornets de Groot dropped two lead balls, one 10× heavier, 30 ft from the Nieuwe Kerk tower onto a wooden board and heard a single thud; published 1586, three years before Galileo reached Pisa; dates 1548–1620"
      source: "research/history.md §1 and Cast list"
      url: "https://en.wikipedia.org/wiki/Delft_tower_experiment"
    - what: "Pisa Leaning Tower story comes only from Viviani (LEGEND/HEDGE)"
      source: "research/history.md §1"
      url: "https://physicsworld.com/a/the-legend-of-the-leaning-tower/"
  computed:
    - "python3 -I -c 'print(round(30*0.3048, 1), 1589 - 1586)' -> 9.1 m; 3 years before 1589"
  licence: "CC BY-NC-SA 4.0"

"story:p-galileo":
  ocw:
    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Course notes Ch 4 §4.5 Constant Acceleration (x = ½at²)"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_chapter4.pdf"
      took: "distance proportional to time squared under constant acceleration"
  openstax:
    - book: "Physics"
      section: "3.2 Representing Acceleration with Equations and Graphs"
      url: "https://openstax.org/books/physics/pages/3-2-representing-acceleration-with-equations-and-graphs"
      took: "constant acceleration kinematics on an incline"
  history:
    - what: "La Bilancetta (1586, age 22) debunking Vitruvius's bathtub overflow story with a hydrostatic balance; dates 1564–1642"
      source: "research/history.md §3 and Cast list"
      url: "https://math.nyu.edu/Archimedes/Crown/bilancetta.html"
    - what: "Vincenzo Galilei (Florence, c. 1589): octave on a lute string needs 4× the weight, not 2× (Pythagoras hammers LEGEND)"
      source: "research/history.md §5"
      url: "https://aps.org/apsnews/2015/07/death-vincenzo-galilei"
    - what: "Pisa tower story from Viviani only (LEGEND/HEDGE)"
      source: "research/history.md §1"
      url: "https://physicsworld.com/a/the-legend-of-the-leaning-tower/"
    - what: "Padua c. 1604 inclined planes (TRUE) and Stillman Drake's singing/lute-fret reconstruction (HEDGE)"
      source: "research/history.md §1"
      url: "https://www.teacherplus.org/?p=16841"
    - what: "Venice and Padua 1609–10: heard of Dutch spyglass May 1609, 8–9× telescope shown 25 Aug 1609 from San Marco campanile, Jupiter's moons 7–15 Jan 1610, Sidereus Nuncius March 1610"
      source: "research/history.md §1"
      url: "https://www.astronomy.com/today-in-the-history-of-astronomy/jan-7-1610-galileo-sees-four-moons-of-jupiter"
  computed:
    - "python3 -I -c 'print(1586 - 1564, [n**2 - (n-1)**2 for n in range(1, 5)], [n**2 for n in range(1, 5)])' -> age 22; [1, 3, 5, 7]; [1, 4, 9, 16]"
  licence: "CC BY-NC-SA 4.0"

"story:p-newton":
  ocw:
    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Course notes Ch 9 §9.2 Universal Law of Gravitation and the Circular Orbit of the Moon"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_chapter9.pdf"
      took: "Moon's centripetal acceleration and orbital period comparison"
  openstax:
    - book: "Astronomy 2e"
      section: "3.3 Newton's Universal Law of Gravitation"
      url: "https://openstax.org/books/astronomy-2e/pages/3-3-newtons-universal-law-of-gravitation"
      took: "first law straight-line path vs curved orbit; 60 Earth radii, 1/3600, 0.00272 m/s²"
    - book: "College Physics 2e"
      section: "6.5 Newton's Universal Law of Gravitation; 25.5 Dispersion: The Rainbow and Prisms"
      url: "https://openstax.org/books/college-physics-2e/pages/6-5-newtons-universal-law-of-gravitation"
      took: "'pretty nearly' agreement; 27.3 d orbit; violet refracts more than red in glass"
  history:
    - what: "Woolsthorpe/Cambridge 1666 and 6 Feb 1672 letter: shutter hole, prism spectrum, experimentum crucis with second prism showing white light is a mixture; dates 1643–1727"
      source: "research/history.md §5 and Cast list"
      url: "https://en.wikisource.org/wiki/New_Theory_About_Light_and_Colour"
    - what: "Woolsthorpe 1666 apple account told to Stukeley in 1726 ('occasion'd by the fall of an apple, as he sat in contemplative mood'); did not hit his head; 'an 18th-century sound bite' (HEDGE)"
      source: "research/history.md §1"
      url: "https://www.nbcnews.com/id/wbna34944738"
    - what: "Halley's August 1684 visit and the 1687 Principia"
      source: "research/history.md §1"
      url: "https://mathshistory.st-andrews.ac.uk/Biographies/Halley.html"
  computed:
    - "python3 -I -c 'import math; r=3.84e8; T=2.3605847e6; a=4*math.pi**2*r/T**2; print(round(9.8/3600, 5), round(0.5*a*1000, 2), round(0.5*a*3600, 2), round(0.5*9.8, 1))' -> 0.00272 m/s²; 1.36 mm in 1 s; 4.9 m in 60 s; 4.9 m apple in 1 s"
  licence: "CC BY-NC-SA 4.0"

