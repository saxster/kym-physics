# Provenance for the cast life stories, part 1 (group: people): one entry per story ("story:<id>").
# Every number in these stories was recomputed with python3 -I from the inputs named here; the one-liners are listed
# under `computed:` (the build ignores that key). Claims outside grounding/ and research/ are flagged in the writer's report.

"story:p-aryabhata":
  openstax:
    - book: "Astronomy 2e"
      section: "4.1 Earth and Sky; 4.7 Eclipses of the Sun and Moon"
      url: "https://openstax.org/books/astronomy-2e/pages/4-1-earth-and-sky"
      took: "apparent turning of the sky vs turning Earth; Foucault pendulum 1851; lunar and solar eclipses as shadows"
  history:
    - what: "Kusumapura (Patna), 499 CE (some scholars date nearer 510); boat analogy; eclipses as shadows, not Rahu; caution against heliocentric and '99.4% accurate' online claims; dates 476–c.550"
      source: "research/history.md §2 and Cast list"
      url: "https://en.wikipedia.org/wiki/Aryabhatiya"
    - what: "Aryabhata biography and boat analogy"
      source: "research/history.md §2"
      url: "https://www.schoolsobservatory.org/learn/history/biographies/aryabhata"
    - what: "Foucault pendulum, Panthéon, Paris, 1851"
      source: "research/history.md true-stories list"
      url: "https://comptes-rendus.academie-sciences.fr/physique/item/10.1016/j.crhy.2017.11.003.pdf"
  computed:
    - "python3 -I -c 'print(499 - 476)' -> 23 years old in 499 CE"
  licence: "CC BY-NC-SA 4.0"

"story:p-brahmagupta":
  openstax:
    - book: "Astronomy 2e"
      section: "3.3 Newton's Universal Law of Gravitation"
      url: "https://openstax.org/books/astronomy-2e/pages/3-3-newtons-universal-law-of-gravitation"
      took: "Moon at 60 Earth radii, 1/3600 inverse-square test, 0.00272 m/s² linking fall to orbit"
  history:
    - what: "Ujjain region, 628 CE; Al-Biruni (c. 1030) report that heavy things fall to the Earth by a law of nature because it is the Earth's nature to attract them as it is water's nature to flow; qualitative idea with no inverse-square law or orbital link (HEDGE); dates 598–668"
      source: "research/history.md §2 and Cast list"
      url: "https://arxiv.org/pdf/2510.17600"
    - what: "Al-Biruni's India (c. 1030)"
      source: "research/history.md §2"
      url: "https://en.wikipedia.org/wiki/India_(Al-Biruni)"
  computed:
    - "python3 -I -c 'print(628 - 598, 60**2, round(9.8/60**2, 5))' -> age 30 in 628 CE; 3600; 0.00272 m/s²"
  licence: "CC BY-NC-SA 4.0"

