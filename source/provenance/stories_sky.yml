# Provenance for the sky stories (group: sky): one entry per story ("story:<id>") and per figure ("fig:<name>").
# Every number in these stories was recomputed with python3 -I from the inputs named here; the one-liners are listed
# under `computed:` (the build ignores that key). Claims the writer could not source are listed in the writer's report.

"story:gravity":
  ocw:
    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Course notes Ch 9 §9.2 Universal Law of Gravitation and the Circular Orbit of the Moon; Astronomical Data sheet (sidereal month 2.3605847e6 s)"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_chapter9.pdf"
      took: "the Moon's acceleration from its orbit; orbital speed about 1 km/s"
  openstax:
    - book: "Astronomy 2e"
      section: "3.3 Newton's Universal Law of Gravitation"
      url: "https://openstax.org/books/astronomy-2e/pages/3-3-newtons-universal-law-of-gravitation"
      took: "60 Earth radii, 1/3600, 0.00272 m/s²; the Moon falls around Earth, not to it; every mass pulls every other"
    - book: "College Physics 2e"
      section: "6.5 Newton's Universal Law of Gravitation"
      url: "https://openstax.org/books/college-physics-2e/pages/6-5-newtons-universal-law-of-gravitation"
      took: "Newton's 'pretty nearly'; the under-1% leftover (elliptical orbit, Earth moving); equal and opposite pulls; Earth–Moon centre of mass 1,700 km below the surface; G and the force between two 1 kg masses"
  research:
    - what: "'no gravity in space': 81% of 13-year-olds (Stead & Osborne 1980)"
      source: "research/misconceptions.md §4"
      url: "https://spark.iop.org/many-students-think-object-beyond-earths-atmosphere-space-does-not-experience-force-gravity"
  history:
    - what: "Woolsthorpe 1666; Stukeley 1726: 'occasion'd by the fall of an apple, as he sat in contemplative mood'; the apple did not hit his head; 'an 18th-century sound bite' (HEDGE, told as the story goes)"
      source: "research/history.md"
      url: "https://www.nbcnews.com/id/wbna34944738"
    - what: "Halley's question, Cambridge, August 1684; the lost paper; Principia 1687, printed at Halley's expense"
      source: "research/history.md"
      url: "https://mathshistory.st-andrews.ac.uk/Biographies/Halley.html"
    - what: "Cavendish, Clapham 1798, inside a shed"
      source: "research/history.md"
      url: "https://en.wikipedia.org/wiki/Cavendish_experiment"
  computed:
    - "python3 -I -c 'import math; r=3.84e8; T=2.3605847e6; a=4*math.pi**2*r/T**2; print(round(a,6), round(0.5*a*1000,2), round(0.5*a*3600,2), round(2*math.pi*r/T))' -> 0.002721 m/s²; 1.36 mm in 1 s; 4.9 m in 60 s; 1022 m/s"
    - "python3 -I -c 'print(round(9.8/3600,5), round(3.84e8/6.371009e6,1), round(0.5*9.8,2))' -> 0.00272; 60.3 Earth radii; an apple falls 4.9 m in 1 s"
    - "1684 - 1609 = 75 years from Astronomia Nova to Halley's question"
  licence: "CC BY-NC-SA 4.0"

"story:orbits":
  ocw:
    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Astronomical Data and Physical Constants sheets (G, Earth mass 5.97219e24 kg, mean radius 6.371009e6 m); PS.3.1 Orbital Circular Motion"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_data.pdf"
      took: "inputs for g at 400 km, orbital speed and period, circular and escape speeds"
  openstax:
    - book: "Astronomy 2e"
      section: "3.5 Motions of Satellites and Spacecraft; 3.3 (weightless = falling around); Ch 3 Thought Questions (ISS at 400 km)"
      url: "https://openstax.org/books/astronomy-2e/pages/3-5-motions-of-satellites-and-spacecraft"
      took: "Newton's cannon and the De Mundi Systemate (1731) diagram; about 8 and 11 km/s; no engine needed above the air; low orbits decay; the snapped-cable lift; ISS 400 km"
    - book: "College Physics 2e"
      section: "6.5 (no zero gravity in orbit); 6.6 (mass cancels: same height, same speed)"
      url: "https://openstax.org/books/college-physics-2e/pages/6-5-newtons-universal-law-of-gravitation"
      took: "weightlessness is free fall at the local g; satellite mass cancels"
  research:
    - what: "ISS: about 90 minutes an orbit, 16 orbits a day, mass 419,725 kg"
      source: "NASA: Space Station Facts and Figures"
      url: "https://www.nasa.gov/international-space-station/space-station-facts-and-figures/"
    - what: "'no gravity in space' 81%; phyphox 'Acceleration (with g)' reads about 9.81 at rest and near zero in a 40 cm drop (about 0.3 s)"
      source: "research/misconceptions.md §4"
      url: "https://phyphox.org/wiki/index.php/Category:Built-in_experiments"
    - what: "IGCSE 0625: weight is the gravitational force on a mass (so an orbiting astronaut still has weight)"
      source: "research/school-wording.md §1"
    - what: "Bandra–Worli Sea Link 5.6 km (for the 0.7 s crossing)"
      source: "research/history.md §9"
      url: "https://en.wikipedia.org/wiki/Bandra%E2%80%93Worli_Sea_Link"
  history:
    - what: "Principia 1687; Newton 1643–1727 (so 1731 is four years after his death)"
      source: "research/history.md"
      url: "https://mathshistory.st-andrews.ac.uk/Biographies/Halley.html"
  computed:
    - "python3 -I -c 'R=6.371009e6; print(round((R/(R+400e3))**2,4))' -> 0.8853 (89%)"
    - "python3 -I -c 'import math; G=6.67384e-11; M=5.97219e24; r=6.371009e6+400e3; v=(G*M/r)**0.5; print(round(v/1e3,2), round(2*math.pi*r/v/60,1), round(86400/(2*math.pi*r/v),1))' -> 7.67 km/s, 92.4 min, 15.6 orbits/day"
    - "python3 -I -c 'G=6.67384e-11; M=5.97219e24; R=6.371009e6; print(round((G*M/R)**0.5/1e3,2), round((2*G*M/R)**0.5/1e3,2))' -> 7.91 and 11.19 km/s"
    - "python3 -I -c 'print(round(5.6/7.9,2), round((2*0.40/9.81)**0.5,3), round(419725/1000))' -> 0.71 s across the Sea Link; 0.286 s drop; 420 t"
  licence: "CC BY-NC-SA 4.0; NASA facts cited"

"story:kepler":
  ocw:
    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Course notes Ch 25 Celestial Mechanics §25.1 and §25.6 (Kepler's laws I–III; 1619)"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_chapter25new.pdf"
      took: "statement of the three laws; third law 1619"
    - course: "8.282J Introduction to Astronomy, Spring 2006"
      where: "Problem Set 3, Problem 1 Eccentric Orbits (Mars e = 0.093)"
      url: "https://ocw.mit.edu/courses/8-282j-introduction-to-astronomy-spring-2006/0c2abfdb3d15998574e199d4294e5475_ps3.pdf"
      took: "Mars eccentricity; nearest/farthest ratio"
  openstax:
    - book: "Astronomy 2e"
      section: "3.1 The Laws of Planetary Motion"
      url: "https://openstax.org/books/astronomy-2e/pages/3-1-the-laws-of-planetary-motion"
      took: "Tycho's twenty years without a telescope and the tables; Kepler first assumed circles; ellipse, foci (Kepler's word), Sun at one focus; equal areas; P² = a³ with Mars P = 1.88 yr; 1609 and 1619; laws describe, Newton explained; pins-and-string demo"
    - book: "Astronomy 2e"
      section: "3.4 Orbits in the Solar System"
      url: "https://openstax.org/books/astronomy-2e/pages/3-4-orbits-in-the-solar-system"
      took: "Mars unusually eccentric (only Mercury more so); naked-eye data would not have shown the ellipse for other planets"
  research:
    - what: "Moon's angular size 0.518° (for 'eight minutes is a quarter of the Moon's width')"
      source: "NASA NSSDC Moon Fact Sheet"
      url: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html"
  history:
    - what: "Hven 1576–97, Uraniborg; Prague, Kepler arrives February 1600; Tycho dies October 1601; 8 minutes of arc; Astronomia Nova 1609; poisoning speculation, 2010 exhumation inconclusive; Galileo's telescope 1609"
      source: "research/history.md"
      url: "https://www.astronomy.ohio-state.edu/thompson.1847/161/watershed.html"
  computed:
    - "python3 -I -c 'print(round(8/(0.518*60),2), round((1-0.093)/(1+0.093),3), round((1-0.093**2)**0.5,4))' -> 0.26 of the Moon's width; 0.83; b/a = 0.9957"
    - "python3 -I -c 'print(round(1.88**(2/3),3), round(1.88**(2/3)*1.5e8/1e6))' -> 1.523 AU; 228 million km"
    - "home box: pins 2 cm apart (c = 1 cm), loop 22 cm (a = 10 cm): b = sqrt(100-1) = 9.95 cm, 0.5 mm short of a circle; 1609 - 1576 = 33; 1684 - 1609 = 75"
  licence: "CC BY-NC-SA 4.0"

"story:earth-turns":
  openstax:
    - book: "Astronomy 2e"
      section: "4.1 Earth and Sky"
      url: "https://openstax.org/books/astronomy-2e/pages/4-1-earth-and-sky"
      took: "seeing alone cannot tell whether the sky or Earth turns; accepted from the 17th century; Foucault 1851 as the unambiguous demonstration (a pendulum keeps its plane); Mumbai at 19.08° N"
  research:
    - what: "Earth volumetric mean radius 6371 km (Mumbai's speed round the axis)"
      source: "NASA NSSDC Earth Fact Sheet"
      url: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html"
    - what: "IGCSE 0625 6.1.1: Earth rotates on its tilted axis once in approximately 24 hours"
      source: "research/school-wording.md"
  history:
    - what: "Kusumapura (Patna) 499 CE; Aryabhata 476–c.550; stars seem to move westward because Earth turns, like a person in a boat seeing the shore slide back; eclipses as shadows, not demons; some scholars date the text nearer 510; avoid 'heliocentric' and '99.4% accurate'"
      source: "research/history.md"
      url: "https://en.wikipedia.org/wiki/Aryabhatiya"
    - what: "Foucault, Panthéon 1851: 67 m wire, 28 kg bob (AS 4.1 gives 60 m, 25 kg; told as 'about'); newspapers asked 'Avez-vous vu tourner la Terre?'"
      source: "research/history.md"
      url: "https://comptes-rendus.academie-sciences.fr/physique/item/10.1016/j.crhy.2017.11.003.pdf"
  computed:
    - "python3 -I -c 'import math; print(round(2*math.pi*6371*math.cos(math.radians(19.08))), round(2*math.pi*6371*math.cos(math.radians(19.08))/24), 360/24)' -> 37,833 km a day; 1,576 km/h; 15°/h"
    - "python3 -I -c 'import math; v=2*math.pi*6.371e6*math.cos(math.radians(19.08))/86400; a=v**2/(6.371e6*math.cos(math.radians(19.08))); print(round(v), round(a,4), round(a/9.8*100,2))' -> 438 m/s; 0.0318 m/s²; 0.32% of g (about 1/300)"
    - "499 - 476 = 23; 1851 - 499 = 1352"
  licence: "CC BY-NC-SA 4.0"

"story:seasons":
  openstax:
    - book: "Astronomy 2e"
      section: "4.2 The Seasons"
      url: "https://openstax.org/books/astronomy-2e/pages/4-2-the-seasons"
      took: "distance idea refuted (3% distance change, closest in January, opposite hemispheres); tilt fixed in space; the two effects (angle, day length); flashlight demo; solstices and equinoxes; noon-altitude method; near the equator seasons are wet and dry; warmest weeks come after the solstice"
  research:
    - what: "obliquity 23.44°; perihelion 147.095 and aphelion 152.100 million km"
      source: "NASA NSSDC Earth Fact Sheet"
      url: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html"
    - what: "A Private Universe: 21 of 23 Harvard graduates and faculty wrong (count from secondary write-ups); distance idea 'by far the most common explanation'; Mumbai's January its coolest month; Australia's summer in December"
      source: "research/misconceptions.md §12"
      url: "https://www.tieonline.com/article/307/student-misconceptions-where-do-they-come-from-"
    - what: "A Private Universe dated 1987 in most sources (one library record says 1989)"
      source: "research/sources.md"
      url: "https://serc.carleton.edu/resources/34251.html"
    - what: "IGCSE 0625 6.1.1 links the yearly orbit to the periodic nature of the seasons; tilt not explicitly linked (bridge sentence)"
      source: "research/school-wording.md"
    - what: "IMD normal monsoon onset for Mumbai, 11 June"
      source: "research/history.md §9"
      url: "https://mausam.imd.gov.in/backend/assets/press_release_pdf/IMD_Press_release_new_onset_and_withdrawal_dates%28Final%29.pdf"
  computed:
    - "python3 -I -c 'print(round(152.100/147.095,4), round((152.100/147.095)**2,4))' -> 1.034 (3.4% farther); 1.069 (6.9% more sunlight in January)"
    - "python3 -I -c 'p=19.08;e=23.44;print(round(90-abs(p-e),2),round(90-p,2),round(90-(p+e),2))' -> 85.64, 70.92, 47.48"
    - "python3 -I -c 'import math;print(round(math.sin(math.radians(85.64))/math.sin(math.radians(47.48)),3))' -> 1.353"
    - "python3 -I -c 'import math;p=math.radians(19.08);d=math.radians(23.44);print(round(2*math.degrees(math.acos(-math.tan(p)*math.tan(d)))/15,2),round(2*math.degrees(math.acos(math.tan(p)*math.tan(d)))/15,2))' -> 13.15 h, 10.85 h (geometric; 2.3 h apart)"
    - "python3 -I -c 'print(round(6371/149.6e6*100,4))' -> 0.0043% (the 'leaning half is closer' effect)"
    - "zero-shadow days around mid-May and late July: grounding/ch14.md's approximate declination formula (ASSUMED; needs an almanac check), stated in the story only as 'in May' and 'in July'"
  licence: "CC BY-NC-SA 4.0"

