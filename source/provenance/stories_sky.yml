    - "python3 -I -c 'print(round((1.9884e30/1.49598e11**3)/(7.3477e22/3.844e8**3),3))' -> 0.458"
    - "python3 -I -c 'G=6.67384e-11;M=7.3477e22;d=3.844e8;R=6.371009e6;print(G*M/(d-R)**2, G*M/d**2, G*M/(d+R)**2)' -> 3.43e-5, 3.32e-5, 3.21e-5 m/s² (near 3.4% above centre, far 3.2% below; difference 1.1e-6 = 1.15e-7 of g; Moon's pull 3.4e-6 of g)"
    - "2 x 6371 = 12,742 km"
