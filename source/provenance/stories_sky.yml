  ocw:
    - course: "8.01SC Classical Mechanics, Fall 2016"
      where: "Astronomical Data and Physical Constants sheets (Sun and Earth masses, AU, year); Course notes Ch 25 (Kepler's third law)"
      url: "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/mit8_01scs22_data.pdf"
      took: "inputs for the free-orbit period at the L1 radius and the Hill-sphere estimate of L1"
  openstax:
    - book: "Astronomy 2e"
      section: "3.1 The Laws of Planetary Motion (third law: smaller orbit, shorter period)"
      url: "https://openstax.org/books/astronomy-2e/pages/3-1-the-laws-of-planetary-motion"
      took: "Kepler's third law as the objection L1 answers"
  research:
    - what: "halo orbit insertion 6 January 2024; L1 roughly 1.5 million km from Earth on the moving Sun–Earth line; period about 177.86 days"
      source: "ISRO: Aditya-L1 halo orbit insertion"
      url: "https://www.isro.gov.in/ISRO_EN/halo-orbit-insertion-adtya-l1.html"
    - what: "L1 at 1.497 million km by the Hill-sphere approximation r = a(M_E/3M_S)^(1/3), matching ISRO's 1.5 million km; Aditya-L1 is in a halo orbit, not sitting still"
      source: "grounding/ch15.md §15.3"
  computed:
    - "python3 -I -c 'import math; AU=1.49598e11; G=6.67384e-11; Ms=1.9884e30; Me=5.97219e24; l1=AU*(Me/(3*Ms))**(1/3); r=AU-l1; T=2*math.pi*(r**3/(G*Ms))**0.5/86400; print(round(l1/1e9,3), round(T,1), round(365.3-T,1), round(G*Ms/r**2/(G*Me/l1**2)))' -> 1.497 million km; 359.8 d; 5.5 d a year; Sun's pull 34 times Earth's"
    - "python3 -I -c 'AU=1.49598e11; print(round(AU/(1+(1.9884e30/5.97219e24)**0.5)/1e3,-3), round(1.5e6/384400,1), round(177.86/30.44,1), round(183/5.5))' -> pulls equal at 259,000 km from Earth; 3.9 Moon distances; 5.8 months; 33 years to reach the far side"
  licence: "CC BY-NC-SA 4.0; ISRO material cited under ISRO's copyright policy"

