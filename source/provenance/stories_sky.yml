      url: "https://openstax.org/books/astronomy-2e/pages/4-6-ocean-tides-and-the-moon"
      took: "daily delay matches moonrise; tides from differences in the Moon's pull; water flows into two bulges, not lifted or stretched; two highs a day; Sun less than half as effective; spring ('spring up') and neap; land, friction, depth, wind mean tide tables per place; an all-water Earth would distort by nearly 1 m; Earth's spin slows 0.002 s per century; the Moon recedes 3.8 cm a year (Apollo mirrors)"
