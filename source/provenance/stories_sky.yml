    - what: "Newton 1687 (the Principia) as the first explanation of tides by the Moon's pull: standard history, NOT in research/history.md; flagged in the writer's report"
      source: "research/history.md"
      url: "https://mathshistory.st-andrews.ac.uk/Biographies/Halley.html"
  computed:
