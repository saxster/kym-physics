# Ledger for the stories in the waves group (resonance, tabla, doppler, seeing, speed-of-light, refraction, prism,
# blue-sky, raman, light-wave) and their s_ figures. Course and book names are the keys in provenance/sources.yml
# (18.03 and University Physics Volume 3 follow the chapter ledgers' spelling). Every number in the stories was
# recomputed with python3 -I (the script is in the writer's report); inputs called "a guess" or "suppose" in the text
# are ASSUMED. Reused chapter figures are listed under figures: with origin "reused from Chapter N".

